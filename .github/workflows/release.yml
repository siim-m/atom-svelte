name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    environment: npm
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install current npm
        run: npm install --global npm@12.2.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run check

      - name: Verify release tag
        run: |
          version=$(node --print "require('./package.json').version")
          test "$RELEASE_TAG" = "v$version"

      - name: Publish package
        run: |
          name=$(node --print "require('./package.json').name")
          version=$(node --print "require('./package.json').version")
          if [[ "$version" == *-* ]]; then
            tag=${version#*-}
            tag=${tag%%.*}
          else
            tag=latest
          fi
          # npm prints a bare string instead of an array when only one version exists.
          versions=$(npm view "$name" versions --json)
          has_stable=$(node --print "[].concat(JSON.parse(process.argv[1])).some((v) => !v.includes('-'))" "$versions")
          if [[ "$tag" != latest && "$has_stable" == false ]]; then
            # Until a stable version exists, latest follows the newest prerelease.
            npm publish --access public --provenance --tag latest
            npm dist-tag add "$name@$version" "$tag"
          else
            npm publish --access public --provenance --tag "$tag"
          fi
